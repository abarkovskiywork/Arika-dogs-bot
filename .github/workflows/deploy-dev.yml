name: Deploy dev bot

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/arika-dogs-bot-dev
            git fetch origin dev
            git reset --hard origin/dev
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart arika-dogs-bot-dev || pm2 start dist/bot.js --name arika-dogs-bot-dev
            pm2 save